[project]
name = "software-factory"
version = "0.1.0"
description = "Runs the Tickets of a Spec through a Pipeline of Fresh agents and lands them on an integration branch"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0.2",
]

[project.scripts]
factory = "factory.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0.12.20261103",
]

# The project resolves only from PyPI, so a machine-wide uv index never reaches uv.lock.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The slowest test takes about 2 s, so one that hangs or slows down fails early.
timeout = 10
# CI fails when the tests outside tests/contract take longer than this together, see tests/time_budget.py.
# The summed time of one commit varies by a third between CI runners, and the suite measured up to 865 s, so the
# budget leaves room for that noise and still fails a suite that slows down by minutes.
time_budget = "1200"

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

# The coverage tools run outside the locked environment, so mypy finds no package for them.
[[tool.mypy.overrides]]
module = ["coverage", "coverage.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
src = ["src", "tests", "tests/contracts", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
