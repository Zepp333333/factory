# Pipeline `self` builds the factory with the factory.
# `sync` brings the integration branch's tip in first, so the Gates judge the combined tree that `merge` fast-forwards.
# A text conflict goes to `resolve`, which only edits files, and the host makes the merge commit.
# There is no human Decider yet, so a Ticket that fails or runs out of fix Rounds is abandoned for the owner to pick up.

start: implement
escalate_to: abandoned

defaults:
  model: sonnet
  timeout: 1h

# After the last merge the Describer writes the final PR from skill `pr`; if it fails, the engine's own text is used.
describer: {role: describer, attempts: 2, timeout: 20m}

roles:
  implementer:
    prompt: prompts/implementer.md
    output: schemas/implementer.json

  reconciler:
    prompt: prompts/reconciler.md
    output: schemas/reconciler.json

  describer:
    prompt: prompts/describer.md
    output: schemas/describer.json
    skills: [pr]

stages:
  implement:
    role: implementer
    inputs: [spec, ticket]
    next: {done: sync}

  fix:
    role: implementer
    inputs:
      - spec
      - ticket
      - cause
      - {stage: [implement, fix], rounds: all}
    rounds: {max: 3}
    escalate: {from_round: 2, model: opus}
    next: {done: sync}

  resolve:
    role: reconciler
    inputs:
      - spec
      - ticket
      - cause
    rounds: {max: 2}
    next: {done: sync}

gates:
  ruff:
    kind: command
    with:
      run: uv run --locked ruff check --output-format concise && uv run --locked ruff format --check --output-format concise
      timeout: 5m
      match: '^\S+:\d+:\d+: '
    next: {pass: mypy, fail: fix}

  mypy:
    kind: command
    with:
      run: uv run --locked mypy
      timeout: 10m
    next: {pass: pytest, fail: fix}

  pytest:
    kind: command
    with:
      run: uv run --locked pytest -q
      timeout: 20m
      match: '^(FAILED|ERROR) '
    next: {pass: merge, fail: fix}

operations:
  sync:
    kind: sync
    next: {clean: ruff, conflict: resolve}

  merge:
    kind: merge
    next: {merged: done}
