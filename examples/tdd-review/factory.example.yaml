# A Target project's file for Pipeline `tdd-review`: copy it to the project's repository and fill in `vars`.
# `tdd-review` is a Pipeline of the factory Layer of the Library.
pipeline: tdd-review
base: main

# `release` is the Release channel. `redeploy` is a service the owner can roll back by deploying the last good build again.
# `shipped_binary` is an app or a library that users install, so a merged change may stay on their machines for good.
release: redeploy

# `workbench` is where the owner watches the Run: `terminal` for a plain terminal, `orca` for the Orca IDE.
workbench: terminal

max_parallel: 2

vars:
  build: make build
  test: make test JUNIT="$GATE_OUT/junit.xml" LCOV="$GATE_OUT/lcov.info"
  junit: junit.xml
  coverage_format: lcov
  coverage_report: lcov.info
  scope: "! git diff --name-only HEAD~1 | grep -q '^\\.github/'"

sandbox:
  kind: sbx
  cpus: 2
  memory: 4g
  egress: []
