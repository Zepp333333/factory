# Pipeline `review-via-tracker` runs its review loop through the Tracker, so the owner reads it on the Ticket.
# `review` reports and does not edit: the factory posts its summary and each of its findings as comments on the Ticket.
# The function Decider `findings` ends the loop when the review found nothing, and otherwise `fix` reads the comments,
# fixes, and answers each one, which `post_answers` posts as replies, and `review` looks again with those answers.
# The loop stops at the `rounds` of `review`, and the Stage out of Rounds goes to `escalation`, as any Stage does.
# `catch_up` brings the Integration branch's tip in, the Gates run again on the combined tree, and `merge` fast-forwards.
# The project file sets `vars` `build`, `test` and `junit`, and `release`, which the reviewer reads.
# It needs a Tracker with a TicketBoard and Discussions, so GitHub or GitLab and no Spec folder.

start: implement
escalate_to: escalation

defaults:
  model: sonnet
  timeout: 1h
  attempts: 2

stages:
  implement:
    role: implementer
    inputs: [spec, ticket]
    next: {done: build}

  review:
    role: tracker-reviewer
    model: opus
    workspace: ro
    inputs: [spec, ticket, {tracker: ticket_comments, posted_by: [post_answers]}]
    rounds: {max: 3}
    next: {done: post_review}

  fix:
    role: tracker-fixer
    inputs:
      - spec
      - ticket
      - cause
      - {tracker: ticket_comments, posted_by: [post_findings]}
      - {stage: [implement, fix], rounds: all, optional: true}
    rounds: {max: 5}
    escalate: {from_round: 4, model: opus}
    next: {done: post_answers}

  resolve:
    role: reconciler
    inputs: [spec, ticket, cause]
    rounds: {max: 2}
    next: {done: catch_up}

gates:
  build:
    kind: command
    with: {run: "${vars.build}", timeout: 30m}
    next: {pass: tests, fail: fix}

  tests:
    kind: tests
    with: {run: "${vars.test}", junit: "${vars.junit}", timeout: 30m}
    next: {pass: review, fail: fix}

  combined_build:
    kind: command
    with: {run: "${vars.build}", timeout: 30m}
    next: {pass: combined_tests, fail: fix}

  combined_tests:
    kind: tests
    with: {run: "${vars.test}", junit: "${vars.junit}", timeout: 30m}
    next: {pass: merge, fail: fix}

decisions:
  findings:
    decider: {kind: function, function: findings}
    outcomes: [found, clean]
    inputs: [{stage: review}]
    next: {found: fix, clean: catch_up}

  # Whatever no other node can settle ends with the owner.
  escalation:
    decider: {kind: human}
    outcomes: [rework, abandon]
    inputs: [spec, ticket]
    next: {rework: {to: fix, reset_rounds: [fix, review]}, abandon: abandoned, escalate: abandoned}

# The loop depends on what these post, so a Tracker that fails holds them and does not lose a finding or an answer.
operations:
  post_review:
    kind: comment
    with: {from: review, field: summary, text: "Review: ${item}"}
    on_fail: retry
    next: {done: post_findings}

  post_findings:
    kind: comment
    with:
      from: review
      field: findings
      each: true
      text: "${item.id} at ${item.file}:${item.line}: ${item.summary}"
    on_fail: retry
    next: {done: findings}

  post_answers:
    kind: comment
    with:
      from: fix
      field: answers
      each: true
      text: "Reply to comment ${item.comment}: ${item.text}"
    on_fail: retry
    next: {done: build}

  catch_up:
    kind: catch_up
    next: {clean: combined_build, conflict: resolve}

  merge:
    kind: merge
    next: {merged: done}
