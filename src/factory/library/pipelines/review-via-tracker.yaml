# factory-diagram: begin, `factory diagram --write` writes this block
# flowchart TD
#     _start(["start<br/>escalate_to: escalation"])
#     implement["implement<br/>role: implementer"]
#     review["review<br/>role: tracker-reviewer<br/>rounds: max 3"]
#     fix["fix<br/>role: tracker-fixer<br/>rounds: max 5"]
#     resolve["resolve<br/>role: reconciler<br/>rounds: max 2"]
#     build{{"build<br/>command<br/>timeout: 30m"}}
#     tests{{"tests<br/>tests<br/>timeout: 30m"}}
#     combined_build{{"combined_build<br/>command<br/>timeout: 30m"}}
#     combined_tests{{"combined_tests<br/>tests<br/>timeout: 30m"}}
#     findings{"findings<br/>function"}
#     escalation{"escalation<br/>human"}
#     post_review[/"post_review<br/>comment"/]
#     post_findings[/"post_findings<br/>comment"/]
#     post_answers[/"post_answers<br/>comment"/]
#     catch_up[/"catch_up<br/>catch_up"/]
#     merge[/"merge<br/>merge"/]
#     abandoned(["abandoned"])
#     done(["done"])
#     _start --> implement
#     implement -->|"done"| build
#     implement -.->|"failed"| escalation
#     review -->|"done"| post_review
#     review -.->|"exhausted"| escalation
#     review -.->|"failed"| escalation
#     fix -->|"done"| post_answers
#     fix -.->|"exhausted"| escalation
#     fix -.->|"failed"| escalation
#     resolve -->|"done"| catch_up
#     resolve -.->|"exhausted"| escalation
#     resolve -.->|"failed"| escalation
#     build -->|"pass"| tests
#     build -->|"fail"| fix
#     tests -->|"pass"| review
#     tests -->|"fail"| fix
#     combined_build -->|"pass"| combined_tests
#     combined_build -->|"fail"| fix
#     combined_tests -->|"pass"| merge
#     combined_tests -->|"fail"| fix
#     findings -->|"found"| fix
#     findings -->|"clean"| catch_up
#     findings -.->|"escalate"| escalation
#     escalation -->|"rework, reset_rounds: fix, review"| fix
#     escalation -->|"abandon"| abandoned
#     escalation -->|"escalate"| abandoned
#     post_review -->|"done"| post_findings
#     post_findings -->|"done"| findings
#     post_answers -->|"done"| build
#     catch_up -->|"clean"| combined_build
#     catch_up -->|"conflict"| resolve
#     merge -->|"merged"| done
# factory-diagram: end

# Pipeline `review-via-tracker` runs its review loop through the Tracker, so the owner reads it on the Ticket.
# `review` reports and does not edit: the factory posts its summary and each of its findings as comments on the Ticket.
# The function Decider `findings` ends the loop when the review found nothing, and otherwise `fix` reads the comments,
# fixes, and answers each one, which `post_answers` posts as replies, and `review` looks again with its findings and those answers.
# The loop stops at the `rounds` of `review`, and the Stage out of Rounds goes to `escalation`, as any Stage does.
# `catch_up` brings the Integration branch's tip in, the Gates run again on the combined tree, and `merge` fast-forwards.
# The project file sets `vars` `build`, `test` and `junit`, and `release`, which the reviewer reads.
# It needs a Tracker with a TicketBoard and Discussions, so GitHub or GitLab and no Spec folder.

start: implement
escalate_to: escalation

defaults:
  model: sonnet
  timeout: 1h
  attempts: 2

stages:
  implement:
    role: implementer
    inputs: [spec, ticket]
    next: {done: build}

  review:
    role: tracker-reviewer
    model: opus
    workspace: ro
    inputs: [spec, ticket, {tracker: ticket_comments, posted_by: [post_findings, post_answers]}]
    rounds: {max: 3}
    next: {done: post_review}

  fix:
    role: tracker-fixer
    inputs:
      - spec
      - ticket
      - cause
      - {tracker: ticket_comments, posted_by: [post_findings]}
      - {stage: [implement, fix], rounds: all, optional: true}
    rounds: {max: 5}
    escalate: {from_round: 4, model: opus}
    next: {done: post_answers}

  resolve:
    role: reconciler
    inputs: [spec, ticket, cause]
    rounds: {max: 2}
    next: {done: catch_up}

gates:
  build:
    kind: command
    with: {run: "${vars.build}", timeout: 30m}
    next: {pass: tests, fail: fix}

  tests:
    kind: tests
    with: {run: "${vars.test}", junit: "${vars.junit}", timeout: 30m}
    next: {pass: review, fail: fix}

  combined_build:
    kind: command
    with: {run: "${vars.build}", timeout: 30m}
    next: {pass: combined_tests, fail: fix}

  combined_tests:
    kind: tests
    with: {run: "${vars.test}", junit: "${vars.junit}", timeout: 30m}
    next: {pass: merge, fail: fix}

decisions:
  findings:
    decider: {kind: function, function: findings}
    outcomes: [found, clean]
    inputs: [{stage: review}]
    next: {found: fix, clean: catch_up}

  # Whatever no other node can settle ends with the owner.
  escalation:
    decider: {kind: human}
    outcomes: [rework, abandon]
    inputs: [spec, ticket]
    next: {rework: {to: fix, reset_rounds: [fix, review]}, abandon: abandoned, escalate: abandoned}

# The loop depends on what these post, so a Tracker that fails holds them and does not lose a finding or an answer.
operations:
  post_review:
    kind: comment
    with: {from: review, field: summary, text: "Review: ${item}"}
    on_fail: retry
    next: {done: post_findings}

  post_findings:
    kind: comment
    with:
      from: review
      field: findings
      each: true
      text: "${item.id} at ${item.file}:${item.line}: ${item.summary}"
    on_fail: retry
    next: {done: findings}

  post_answers:
    kind: comment
    with:
      from: fix
      field: answers
      each: true
      text: "Reply to comment ${item.comment}: ${item.text}"
    on_fail: retry
    next: {done: build}

  catch_up:
    kind: catch_up
    next: {clean: combined_build, conflict: resolve}

  merge:
    kind: merge
    next: {merged: done}
