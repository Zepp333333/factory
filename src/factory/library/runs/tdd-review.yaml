# factory-diagram: begin, `factory diagram --write` writes this block
# flowchart TD
#     _start(["start<br/>escalate_to: ended"])
#     build[["build<br/>tickets: ${vars.pipeline}"]]
#     describe["describe<br/>role: describer"]
#     open_pr[/"open_pr<br/>open_pr"/]
#     ci(("ci<br/>wait_ci"))
#     ci_fix["ci_fix<br/>role: ci-fixer<br/>rounds: max 2"]
#     ci_build{{"ci_build<br/>command<br/>timeout: 30m"}}
#     ci_tests{{"ci_tests<br/>tests<br/>timeout: 30m"}}
#     ci_failed{"ci_failed<br/>human"}
#     ended(["ended"])
#     _start --> build
#     build -->|"all_merged"| describe
#     build -->|"some_merged"| describe
#     build -->|"none_merged"| ended
#     describe -->|"done"| open_pr
#     describe -->|"failed"| open_pr
#     open_pr -->|"opened"| ci
#     open_pr -->|"failed"| ended
#     ci -->|"green"| ended
#     ci -->|"absent"| ended
#     ci -->|"red"| ci_fix
#     ci -->|"timeout"| ci_failed
#     ci_fix -->|"done"| ci_build
#     ci_fix -->|"failed"| ci_fix
#     ci_fix -->|"exhausted"| ci_failed
#     ci_build -->|"pass"| ci_tests
#     ci_build -->|"fail"| ci_fix
#     ci_tests -->|"pass"| ci
#     ci_tests -->|"fail"| ci_fix
#     ci_failed -->|"recheck"| ci
#     ci_failed -->|"accept"| ended
#     ci_failed -.->|"escalate"| ended
# factory-diagram: end

# The default Run for a project on Pipeline `tdd-review`, whose `vars` it reads: a fix of the CI fixer must pass the
# Run Gates `ci_build` and `ci_tests` before it moves the Integration branch, and a failed one starts the next Round.
start: build
escalate_to: ended

nodes:
  build:
    kind: tickets
    with: {pipeline: '${vars.pipeline}'}
    next: {all_merged: describe, some_merged: describe, none_merged: ended}

  describe:
    role: describer
    next: {done: open_pr, failed: open_pr}

  open_pr:
    kind: open_pr
    next: {opened: ci, failed: ended}

  ci:
    kind: wait_ci
    next: {green: ended, absent: ended, red: ci_fix, timeout: ci_failed}

  ci_fix:
    role: ci-fixer
    workspace: integration
    rounds: {max: 2, then: ci_failed}
    next: {done: ci_build, failed: ci_fix}

  ci_build:
    kind: command
    with: {run: '${vars.build}', timeout: 30m}
    next: {pass: ci_tests, fail: ci_fix}

  ci_tests:
    kind: tests
    with: {run: '${vars.test}', junit: '${vars.junit}', timeout: 30m}
    next: {pass: ci, fail: ci_fix}

  ci_failed:
    decider: {kind: human}
    outcomes:
      recheck: Wait for the CI of the PR's current head again, after you fixed or reran something
      accept: End the Run as it is, with the red CI recorded
    next: {recheck: ci, accept: ended}
