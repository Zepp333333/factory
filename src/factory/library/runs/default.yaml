# The Run of a project file that names no Run graph: the Tickets, the PR text, the PR, then the CI of the PR.
# `${vars.pipeline}` is what the project file's `pipeline:` says.
# `describe` runs with the `defaults` of the Ticket Pipeline, and `overrides.nodes.describe` of the project file sets
# its Role and settings.
start: build
escalate_to: ended

nodes:
  build:
    kind: tickets
    with: {pipeline: '${vars.pipeline}'}
    next: {all_merged: describe, some_merged: describe, none_merged: ended}

  describe:
    role: describer
    next: {done: open_pr, failed: open_pr}

  open_pr:
    kind: open_pr
    next: {opened: ci, failed: ended}

  ci:
    kind: wait_ci
    next: {green: ended, absent: ended, accepted: ended}
