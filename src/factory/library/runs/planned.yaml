# The Run of `default`, with an agent that selects the Tickets and their order: the Fresh agent of the Role `planner`
# takes the Tickets the Tracker read, and a refused output spends one of its `attempts`.
# A Planner that fails every Attempt ends the Run through `escalate_to`, with no Ticket started.
start: select
escalate_to: ended

nodes:
  select:
    role: planner
    attempts: 3
    next: {selected: build, empty: ended}

  build:
    kind: tickets
    with: {pipeline: '${vars.pipeline}'}
    next: {all_merged: describe, some_merged: describe, none_merged: ended}

  describe:
    role: describer
    next: {done: open_pr, failed: open_pr}

  open_pr:
    kind: open_pr
    next: {opened: ci, failed: ended}

  ci:
    kind: wait_ci
    next: {green: ended, absent: ended, red: ci_fix, timeout: ci_failed}

  ci_fix:
    role: ci-fixer
    workspace: integration
    rounds: {max: 2, then: ci_failed}
    next: {done: ci, failed: ci_fix}

  ci_failed:
    decider: {kind: human}
    outcomes:
      recheck: Wait for the CI of the PR's current head again, after you fixed or reran something
      accept: End the Run as it is, with the red CI recorded
    next: {recheck: ci, accept: ended}
