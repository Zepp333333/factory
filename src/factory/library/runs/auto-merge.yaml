# flowchart TD
#     _start(["start<br/>escalate_to: ended"])
#     select[/"select<br/>all"/]
#     build[["build<br/>tickets: ${vars.pipeline}"]]
#     describe["describe<br/>role: describer"]
#     open_pr[/"open_pr<br/>open_pr"/]
#     ci(("ci<br/>wait_ci"))
#     ci_fix["ci_fix<br/>role: ci-fixer<br/>rounds: max 2"]
#     ci_failed{"ci_failed<br/>human"}
#     land[/"land<br/>merge_pr"/]
#     ended(["ended"])
#     _start --> select
#     select -->|"selected"| build
#     select -->|"empty"| ended
#     build -->|"all_merged"| describe
#     build -->|"some_merged"| describe
#     build -->|"none_merged"| ended
#     describe -->|"done"| open_pr
#     describe -->|"failed"| open_pr
#     open_pr -->|"opened"| ci
#     open_pr -->|"failed"| ended
#     ci -->|"green"| land
#     ci -->|"absent"| ended
#     ci -->|"red"| ci_fix
#     ci -->|"timeout"| ci_failed
#     ci_fix -->|"done"| ci
#     ci_fix -->|"failed"| ci_fix
#     ci_fix -->|"exhausted"| ci_failed
#     ci_failed -->|"recheck"| ci
#     ci_failed -->|"accept"| ended
#     ci_failed -.->|"escalate"| ended
#     land -->|"merged"| ended
#     land -->|"refused"| ended
# factory-diagram: end

# The Run of `default` that merges its own PR on green CI, through the Run node `merge_pr`.
# A PR with no CI to read stays open, as one the code host refuses does, because nothing went green.
# `overrides.nodes.land.with.method` of the project file says how it merges: `merge`, `squash` or `rebase`.
start: select
escalate_to: ended

nodes:
  select:
    kind: all
    next: {selected: build, empty: ended}

  build:
    kind: tickets
    with: {pipeline: '${vars.pipeline}'}
    next: {all_merged: describe, some_merged: describe, none_merged: ended}

  describe:
    kind: describe
    role: describer
    next: {done: open_pr, failed: open_pr}

  open_pr:
    kind: open_pr
    next: {opened: ci, failed: ended}

  ci:
    kind: wait_ci
    next: {green: land, absent: ended, red: ci_fix, timeout: ci_failed}

  ci_fix:
    kind: ci_fix
    role: ci-fixer
    rounds: {max: 2, then: ci_failed}
    next: {done: ci, failed: ci_fix}

  ci_failed:
    decider: {kind: human}
    outcomes:
      recheck: Wait for the CI of the PR's current head again, after you fixed or reran something
      accept: End the Run as it is, with the red CI recorded
    next: {recheck: ci, accept: ended}

  land:
    kind: merge_pr
    next: {merged: ended, refused: ended}
