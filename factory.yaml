# The factory builds itself with Pipeline `self`, and docs/self-run.md describes the Run.
pipeline: pipelines/self/pipeline.yaml
base: main

# Two Tickets at once meet in `sync`, and a text conflict between them goes to `resolve`.
max_parallel: 2

# The Gates' tools fill these directories, so a Stage may leave ignored files in them.
# Any other ignored file a Stage creates fails its Attempt, because the Stage boundary commit leaves it out.
caches: [.venv, __pycache__, .pytest_cache, .mypy_cache, .ruff_cache]

# The Gates run `uv run --locked`, which fetches its packages from PyPI.
# One CPU and 2 GB per Ticket leave room for several Tickets at once.
# The agent with a large context does not fit in 1 GB, and the kernel kills it with code 137.
sandbox:
  kind: sbx
  cpus: 1
  memory: 2g
  egress: [pypi.org, files.pythonhosted.org]
workbench: orca
