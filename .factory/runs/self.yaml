#     ci -->|"absent"| ended
#     ci -->|"red"| ci_fix
#     ci -->|"timeout"| ci_failed
#     ci_fix -->|"done"| ci_ruff
#     ci_fix -->|"failed"| ci_fix
#     ci_fix -->|"exhausted"| ci_failed
#     ci_ruff -->|"pass"| ci_mypy
#     ci_ruff -->|"fail"| ci_fix
#     ci_mypy -->|"pass"| ci_pytest
#     ci_mypy -->|"fail"| ci_fix
