# factory-diagram: begin, `factory diagram --write` writes this block
# flowchart TD
#     _start(["start<br/>escalate_to: abandoned"])
#     implement["implement<br/>role: implementer"]
#     review["review<br/>role: reviewer"]
#     fix["fix<br/>role: implementer<br/>rounds: max 3"]
#     fix_combined["fix_combined<br/>role: implementer<br/>rounds: max 3"]
#     resolve["resolve<br/>role: reconciler<br/>rounds: max 2"]
#     ruff{{"ruff<br/>command<br/>timeout: 5m"}}
#     mypy{{"mypy<br/>command<br/>timeout: 10m"}}
#     pytest{{"pytest<br/>command<br/>timeout: 10m"}}
#     ruff_combined{{"ruff_combined<br/>command<br/>timeout: 5m"}}
#     mypy_combined{{"mypy_combined<br/>command<br/>timeout: 10m"}}
#     pytest_combined{{"pytest_combined<br/>command<br/>timeout: 10m"}}
#     catch_up[/"catch_up<br/>catch_up"/]
#     merge[/"merge<br/>merge"/]
#     abandoned(["abandoned"])
#     done(["done"])
#     _start --> implement
#     implement -->|"done"| ruff
#     implement -.->|"failed"| abandoned
#     review -->|"done"| catch_up
#     review -.->|"failed"| abandoned
#     fix -->|"done"| ruff
#     fix -.->|"exhausted"| abandoned
#     fix -.->|"failed"| abandoned
#     fix_combined -->|"done"| catch_up
#     fix_combined -.->|"exhausted"| abandoned
#     fix_combined -.->|"failed"| abandoned
#     resolve -->|"done"| catch_up
#     resolve -.->|"exhausted"| abandoned
#     resolve -.->|"failed"| abandoned
#     ruff -->|"pass"| mypy
#     ruff -->|"fail"| fix
#     mypy -->|"pass"| pytest
#     mypy -->|"fail"| fix
#     pytest -->|"pass"| review
#     pytest -->|"fail"| fix
#     ruff_combined -->|"pass"| mypy_combined
#     ruff_combined -->|"fail"| fix_combined
#     mypy_combined -->|"pass"| pytest_combined
#     mypy_combined -->|"fail"| fix_combined
#     pytest_combined -->|"pass"| merge
#     pytest_combined -->|"fail"| fix_combined
#     catch_up -->|"clean"| ruff_combined
#     catch_up -->|"conflict"| resolve
#     merge -->|"merged"| done
# factory-diagram: end

# Pipeline `self` builds the factory with the factory.
# The Gates run twice.
# Before `review` they judge the Ticket's branch, so the reviewer reads only green code, and a failure goes to `fix`, which returns to `ruff`.
# After `review` and `catch_up` they judge the combined tree that `merge` fast-forwards, with the reviewer's edits and the other Tickets in it, and a failure goes to `fix_combined`, which returns to `catch_up`.
# Each Gate is declared twice, because a Gate has one `next`, and the `with` of the second copy are YAML anchors of the first.
# A text conflict goes to `resolve`, which only edits files, and the host makes the merge commit.
# The Describer's PR names the findings the reviewer skipped.
# There is no human Decider yet, so a Ticket that fails or runs out of fix Rounds is abandoned for the owner to pick up.

start: implement
escalate_to: abandoned

# A second Attempt covers an agent that crashed, timed out, broke its output schema or left conflict markers.
# A lost Sandbox spends no Attempt anyway.
# An agent with no new message or tool result for `stall` is killed as `stalled` and retried like a timeout.
# The longest check, `pytest`, takes under a minute in a Sandbox of 3 CPUs, and the agent may wait for it silently, so 10m leaves a margin over it.
defaults:
  model: opus
  timeout: 1h
  stall: 10m
  attempts: 2

stages:
  implement:
    role: implementer
    inputs: [spec, ticket]
    next: {done: ruff}

  # One Attempt reviews the Ticket and fixes what is worth fixing, because sessions are not resumed.
  review:
    role: reviewer
    model: opus
    inputs: [spec, ticket]
    next: {done: catch_up}

  fix:
    role: implementer
    inputs:
      - spec
      - ticket
      - cause
      - {stage: [implement, fix], rounds: all}
    rounds: {max: 3}
    escalate: {from_round: 2, model: opus}
    next: {done: ruff}

  # Reads the output of `review` too, so that it does not roll back the reviewer's edits.
  fix_combined:
    role: implementer
    inputs:
      - spec
      - ticket
      - cause
      - {stage: [implement, fix, review, fix_combined], rounds: all}
    rounds: {max: 3}
    escalate: {from_round: 2, model: opus}
    next: {done: catch_up}

  resolve:
    role: reconciler
    inputs:
      - spec
      - ticket
      - cause
    rounds: {max: 2}
    next: {done: catch_up}

gates:
  ruff:
    kind: command
    with: &ruff_with
      run: uv run --locked ruff check --output-format concise && uv run --locked ruff format --check --output-format concise
      timeout: 5m
      match: '^\S+:\d+:\d+: '
    next: {pass: mypy, fail: fix}

  mypy:
    kind: command
    with: &mypy_with
      run: uv run --locked mypy
      timeout: 10m
    next: {pass: pytest, fail: fix}

  pytest:
    kind: command
    with: &pytest_with
      run: uv run --locked pytest -n auto -q
      timeout: 10m
      match: '^(FAILED|ERROR) '
    next: {pass: review, fail: fix}

  ruff_combined:
    kind: command
    with: *ruff_with
    next: {pass: mypy_combined, fail: fix_combined}

  mypy_combined:
    kind: command
    with: *mypy_with
    next: {pass: pytest_combined, fail: fix_combined}

  pytest_combined:
    kind: command
    with: *pytest_with
    next: {pass: merge, fail: fix_combined}

operations:
  catch_up:
    kind: catch_up
    next: {clean: ruff_combined, conflict: resolve}

  merge:
    kind: merge
    next: {merged: done}
